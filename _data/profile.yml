short_bio: >-
  <p>
    My research focuses on developing novel and efficient intelligent sensing systems. 
    Mobile and embedded AI systems face challenges such as constrained computations, limited energy availability, and the need for reliable long-term operation. 
    I aim to create practical solutions that prioritize efficiency, sustainability, and user accessibility.
  </p>


  <p> 
    Meanwhile, I am also a lifelong Human-Cat Interaction researcher. 
    My research primarily focuses on how to efficiently communicate and interact with <a href="./showcase">Miss Hope</a>, an adopted American Domestic Shorthair raised in the Midwest. 
    My current projects—How to Prevent Your Cat from Tampering with Jumper Wires and How to Evict Your Feline Overlord from Your Keyboard and Desk—are graciously funded by our first electric officer and wiring manager. 
    They ensure that my circuits (and sanity) remain intact while Miss Hope continues to offer new challenges in the ever-evolving field of HCI.
  </p>

