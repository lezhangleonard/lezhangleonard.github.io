short_bio: >-
  <p>
    My research broadly focuses on bridging embedded and mobile systems with emerging technologies like artificial intelligence, emphasizing system efficiency, sustainability, and user accessibility. 
     Mobile and embedded AI systems and applications often face challenges in limited computing resources and demands in long-term sustainable operations. 
    I aim to develop innovative solutions that address real-world challenges while optimizing resource consumption and enhancing usability for diverse applications.
  </p>


  <p> 
    Meanwhile, I am also a lifelong HCI (aka. Human-Cat Interaction) researcher. 
    My research primarily focuses on how to efficiently communicate and interact with <a href="./showcase">Miss Hope</a>, an adopted American Shorthair raised in the Midwest. 
    My current projects—How to Prevent Your Cat from Tampering with Jumper Wires and How to Evict Your Feline Overlord from Your Keyboard and Desk—are graciously funded by our first electric officer and wiring manager. 
    They ensure that my circuits (and sanity) remain intact while Miss Hope continues to offer new challenges in the ever-evolving field of HCI.
  </p>

