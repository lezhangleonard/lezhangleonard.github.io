short_bio: >-
  <p>
    My name is Leonard Zhang and I am a second-year PhD student at EECS Department at University of Michigan, Ann Arbor, working with <a href="https://samsonsjarkal.github.io/KeSun/">Professor Ke Sun</a> at AmI lab. 
  </p>
  <p>
    My research focuses on developing novel and efficient intelligent embedded and sensing systems. I aim to create practical solutions that prioritize efficiency, sustainability, and user accessibility of mobile sensing systems, while supporting diverse backend machine learning applications.
  </p>
  <p>
    My current research interests include (1) Optimizing AR/VR/wearable vision systems (sensing, transmission, understanding, and rendering etc.), (2) Improving system efficiency for multimodal agents and agentic memory, (3) Low-power and efficient multimodal sensing and on-device learning. 
  </p>
  <p>
    My previous research mainly relates to build efficient machine learning frameworks on resource-constrained embedded systems: 
    <a href="https://dl.acm.org/doi/abs/10.1145/3715014.3722078">ORCA [SenSys'25]</a>,
    <a href="https://dl.acm.org/doi/pdf/10.1145/3658617.3697751">E-QUARTIC [ASP-DAC'25]</a>, 
    <a href="https://arxiv.org/pdf/2302.13155">Antler [EWSN'24]</a>, and
    <a href="https://yuboluo.github.io/publication/07_capuchin/07_Capuchin.pdf">Capuchin [IPSN'22]</a>.
    Previously, I worked with <a href="https://cseweb.ucsd.edu/~trosing/">Professor Tajana Rosing</a> at UCSD and <a href="https://www.cs.unc.edu/~nirjon/">Professor Shahriar Nirjon</a> at UNC-Chapel Hill. 
  </p>
  

  <p> 
    Meanwhile, I am closely working with my furry research partner <a href="./showcase">Miss Hope</a>, an adopted American domestic shorthair raised in the Midwest.
    My research primarily focuses on how to efficiently interact and negotiate with her from tampering with my jumper wires and sleeping on my keyboard.
  </p>

